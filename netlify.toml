[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[functions."send-balance-reminders"]
  schedule = "@daily"

[[redirects]]
  from = "/tours/omaha-beach"
  to = "/normandy"
  status = 301

[[redirects]]
  from = "/tours/omaha-beach.html"
  to = "/normandy"
  status = 301
